<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course  Material </title>



<!-- Bootstrap CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Custom CSS -->
<link rel="stylesheet" href="style.css">


<!-- Bootstrap JS (for responsive behavior) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- jQuery (optional for dynamic rendering) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Sidebar JS -->
<script src = "sidebar.js"></script>

<style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      animation: fadeIn 0.6s ease-in-out;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: all 0.3s ease-in-out;
    }

    input:focus, select:focus {
      border-color: #007bff;
      outline: none;
      box-shadow: 0 0 8px rgba(0,123,255,0.2);
    }

    button[type="submit"] {
      width: 100%;
      background-color: #28a745;
      color: white;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .padding-toptwo{

      padding-top: 100px;

    }
    button[type="submit"]:hover {
      background-color: #218838;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .form-container {
        margin: 20px;
        padding: 20px;
      }
    }
  </style>


</head>
<body>
    
                        <!-- Custom Nav Bar -->
                        <nav>
                            <!-- Side Bar Section-->
                            <ul class="sidebar" id="sidebar">
                                <li onclick="hideSidebar()">
                                    <a href="#"><i class="fa-solid fa-times"></i></a>
                                </li>
                                <li>
                                    <a href="dashboard.html"><i class="fas fa-home"></i> Home</a>
                                </li>
                                <li>
                                    <a href="Add.html"><i class="fa-solid fa-book-open-reader"></i>Add Course Material</a>
                                </li>
                            </ul>
                            
                            <!-- Nav Bar Section-->      
                            <ul>
                                <li class="logo">
                                    <span>Admin Panel Of Vison</span>
                                </li>
                                <li class="hideOnMobile"><a href="Add.html">Add Course Material</a></li>
                                <li class="hideOnMobile"><a href ="dashboard.html"> Dash Board </a></li>
                                <li class="menu-icon" onclick="showSidebar()"><a href="#"><i class="fa-solid fa-bars"></i></a></li>
                            </ul>
                        </nav>
                         
                        <div class="padding-toptwo ">

                        <div class="form-container ">
                            <h2>Add Book to Department</h2>
                            <form id="bookForm">
                              <label for="department">Department Name:</label>
                              <input type="text" id="department" placeholder="e.g., bba" required>
                        
                              <label for="bookId">Book ID:</label>
                              <input type="number" id="bookId" placeholder="e.g., 1" required>
                        
                              <label for="title">Book Title:</label>
                              <input type="text" id="title" placeholder="e.g., Financial Management" required>
                        
                              <label for="cover">Cover Image URL:</label>
                              <input type="url" id="cover" placeholder="Paste image URL" required>
                        
                              <label for="type">Book Type:</label>
                              <select id="type">
                                <option value="pdf">PDF</option>
                                <option value="epub">EPUB</option>
                              </select>
                        
                              <label for="content">Book Link (Content):</label>
                              <input type="url" id="content" placeholder="Paste PDF URL" required>
                        
                              <button type="submit">Add Book</button>
                            </form>
                          </div>

                        </div>
</body>
</html>
